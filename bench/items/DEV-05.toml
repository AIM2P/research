notes = "Problème de développement (réserve Krylov B1, dont la clé bₙ = α√n est publiée au document 04, §6.2), jamais évalué. Clé confirmée par trois contrôles SymPy : moments issus de C(t) = exp(−α²t²/2), récursion des moments (Viswanath–Müller) et déterminants de Hankel : bench/tools/check_dev_keys.py. Champ facultatif answer.assumptions (α > 0), lu par le correcteur du harnais. Relecture du fondateur à faire."
