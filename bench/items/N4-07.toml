notes = "Audit préliminaire (IA, 18 nov. 2026) : énoncé fidèle. c k = taylorCoeffWithin f k univ 0 est le k-ième coefficient de Taylor en 0 ; « numérateur 1 ou premier » devient q.num = 1 ∨ Prime q.num.natAbs (un rationnel de Mathlib est toujours réduit). Point vérifié : l'hypothèse hfdiff : ContDiff ℝ ⊤ f est redondante, et dans le Mathlib actuel ⊤ y signifie « analytique » (ω) et non plus C^∞ ; f est analytique, l'hypothèse est donc vraie (vérifié en Lean) et l'énoncé n'est pas vide. Compile tel quel sous Lean v4.35. Énoncé informel : texte du concours Putnam (MAA), diffusé par PutnamBench avec la permission de la MAA ; vérifier que cette permission couvre sa reprise dans AMP-Bench-mini. Aucune preuve formelle de ce problème ne doit être écrite ni publiée (demande des mainteneurs de PutnamBench). Accepté, à confirmer par le fondateur."
