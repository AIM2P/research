notes = "Audit préliminaire (IA, 18 nov. 2026) : énoncé fidèle. h₁ dit que toute racine complexe de f est réelle, strictement positive et entière ; avec le théorème fondamental de l'algèbre, f est scindé et ses six racines (avec multiplicité) sont 1, 1, 2, 2, 2, 2 (somme 10, produit 16), d'où B = -88, réponse (A). Hypothèses satisfiables par les coefficients de (z - 1)²(z - 2)⁴, l'énoncé n'est donc pas vide. Les coefficients a, b, c, d sont réels, ce que l'énoncé informel sous-entend. Imports : en plus de Complex et Int.floor sur ℝ, l'en-tête importe le théorème fondamental de l'algèbre (Mathlib.Analysis.Complex.Polynomial.Basic) et les relations de Viète, sans lesquels une preuve est hors de portée avec cet en-tête figé. Accepté, à confirmer par le fondateur."
