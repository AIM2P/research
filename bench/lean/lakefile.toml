# Environnement Lean figé d'AMP-Bench-mini (phase P1, 18 novembre 2026).
# Lean v4.35.0, Mathlib v4.35.0 (via Physlib), Physlib v4.35.0.
name = "AMPBench"
defaultTargets = ["AMPBench"]

[leanOptions]
# Protocole : pas de variables implicites automatiques (évite les énoncés vacues).
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "Physlib"
git = "https://github.com/leanprover-community/physlib"
rev = "v4.35.0"

[[lean_lib]]
name = "AMPBench"
